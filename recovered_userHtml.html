ctive { background: #64748B; color: #FFF; font-weight: 800; }    .member-name-link { color: #FBBF24; cursor: pointer; text-decoration: none; font-weight: 800; }    .text-highlight-phone { color: #38BDF8 !important; font-weight: 700; }    @media print { body * { visibility: hidden; } #passbookModal, #passbookModal * { visibility: visible; } #passbookModal { position: absolute; left: 0; top: 0; width: 100%; } .no-print { display: none !important; } }  <\/style><\/head><body class="p-3 p-md-4">  <div class="container-fluid">    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 pb-3 border-bottom border-secondary gap-3 no-print">      <div><h2 class="text-warning fw-bold mb-0">ðª GULLAK CO-OPERATIVE SOCIETY<\/h2><small class="text-info fw-bold">Master Admin Cloud Accounting Software<\/small><\/div>      <div class="d-flex flex-wrap gap-2">        <button class="btn btn-success fw-bold" onclick="openPaymentModal()"><i class="bi bi-cash-stack"><\/i> + Receive RD / Payment<\/button>        <button class="btn btn-danger fw-bold" onclick="openIssueLoanModal()"><i class="bi bi-bank"><\/i> + Issue Loan<\/button>        <button class="btn btn-primary fw-bold" onclick="openAddMemberModal()"><i class="bi bi-person-plus"><\/i> + Add Member<\/button>        <button class="btn btn-gold" onclick="openBulkEntryModal()"><i class="bi bi-table"><\/i> Bulk Entry<\/button>      <\/div>    <\/div>    <div class="row g-3 mb-4 no-print">      <div class="col-6 col-md-2"><div class="card card-glass p-3 stat-card text-center border-primary h-100"><h6 class="text-white small fw-bold mb-1">ð¥ Total Members<\/h6><h3 class="text-primary fw-bold mb-0" id="cardTotalMembers">0<\/h3><\/div><\/div>      <div class="col-6 col-md-2"><div class="card card-glass p-3 stat-card text-center border-success h-100"><h6 class="text-white small fw-bold mb-1">ð° Total RD Recv<\/h6><h3 class="text-success fw-bold mb-0" id="cardTotalRd">₹0<\/h3><\/div><\/div>      <div class="col-6 col-md-2"><div class="card card-glass p-3 stat-card text-center border-danger h-100"><h6 class="text-white small fw-bold mb-1">â ï¸ Total RD Dues<\/h6><h3 class="text-danger fw-bold mb-0" id="cardRdDues">₹0<\/h3><\/div><\/div>      <div class="col-6 col-md-2" onclick="openLoanDuesModal()"><div class="card card-glass p-3 stat-card text-center border-warning h-100"><h6 class="text-white small fw-bold mb-1">ðª Total Loan Dues<\/h6><h3 class="text-warning fw-bold mb-0" id="cardLoanDues">₹0<\/h3><\/div><\/div>      <div class="col-6 col-md-2" onclick="openFundRangeModal()"><div class="card card-glass p-3 stat-card text-center border-light h-100"><h6 class="text-white small fw-bold mb-1">ð¦ Fund Available<\/h6><h3 class="text-white fw-bold mb-0" id="cardFundAvailable">₹0<\/h3><\/div><\/div>      <div class="col-6 col-md-2" onclick="openNpaMembersModal()"><div class="card card-glass p-3 stat-card text-center border-danger h-100"><h6 class="text-white small fw-bold mb-1">ð Total NPA / Loss<\/h6><h3 class="text-danger fw-bold mb-0" id="cardTotalNpa">₹0<\/h3><\/div><\/div>    <\/div>    <ul class="nav nav-pills mb-3 no-print" id="mainTab">      <li class="nav-item"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#tabLedger">Society Master Ledger<\/button><\/li>      <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tabPayments">Collections & Receipts<\/button><\/li>      <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tabLoans">Loan Register<\/button><\/li>    <\/ul>    <div class="tab-content">      <div class="tab-pane fade show active" id="tabLedger"><div class="card card-glass p-3"><div class="d-flex justify-content-between mb-3"><h5 class="text-info fw-bold mb-0">Society Member Accounts<\/h5><input type="text" id="searchBox" class="form-control form-control-sm w-auto" placeholder="Search..." onkeyup="renderMembersTable()"><\/div><div class="table-responsive table-dark-custom"><table class="table table-dark table-hover mb-0"><thead><tr><th>Member<\/th><th>Monthly RD<\/th><th>Gullak Loan<\/th><th>Emergency Loan<\/th><th>Total Loan Due<\/th><th>Status<\/th><th>Actions<\/th><\/tr><\/thead><tbody id="membersTableBody"><\/tbody><\/table><\/div><\/div><\/div>      <div class="tab-pane fade" id="tabPayments"><div class="card card-glass p-3"><h5 class="text-success fw-bold mb-3">Payment Receipts<\/h5><div class="table-responsive table-dark-custom"><table class="table table-dark table-hover mb-0"><thead><tr><th>Txn ID<\/th><th>Date<\/th><th>Member<\/th><th>RD<\/th><th>Interest<\/th><th>Penalty<\/th><th>Mode<\/th><th>Total<\/th><\/tr><\/thead><tbody id="paymentsTableBody"><\/tbody><\/table><\/div><\/div><\/div>      <div class="tab-pane fade" id="tabLoans"><div class="card card-glass p-3"><h5 class="text-warning fw-bold mb-3">Loan Register<\/h5><div class="table-responsive table-dark-custom"><table class="table table-dark table-hover mb-0"><thead><tr><th>Loan ID<\/th><th>Member<\/th><th>Type<\/th><th>Principal<\/th><th>Rate<\/th><th>Outstanding<\/th><\/tr><\/thead><tbody id="loansTableBody"><\/tbody><\/table><\/div><\/div><\/div>    <\/div>  <\/div>    <div class="modal fade" id="paymentModal" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><div class="modal-content"><div class="modal-header"><h5 class="modal-title text-success fw-bold">Record Payment / RD<\/h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"><\/button><\/div><div class="modal-body">    <div class="mb-3"><label class="form-label">Payment Date<\/label><input type="datetime-local" id="payDateTime" class="form-control"><\/div>    <div class="mb-3"><label class="form-label">Select Member<\/label><select id="payMemberSelect" class="form-select"><\/select><\/div>    <div class="row g-2 mb-2"><div class="col-6"><label class="form-label">RD Amount (₹)<\/label><input type="number" id="payRdAmount" class="form-control" value="400"><\/div><div class="col-6"><label class="form-label">Interest (₹)<\/label><input type="number" id="payInterestAmount" class="form-control" value="0"><\/div><\/div>    <div class="mb-3"><label class="form-label">Payment Mode<\/label><div class="d-flex gap-4 p-2 rounded border border-secondary"><div class="form-check"><input class="form-check-input" type="radio" name="singlePayMode" id="singlePayCash" value="CASH" checked><label class="form-check-label text-white fw-bold" for="singlePayCash">ðµ Cash<\/label><\/div><div class="form-check"><input class="form-check-input" type="radio" name="singlePayMode" id="singlePayOnline" value="ONLINE"><label class="form-check-label text-info fw-bold" for="singlePayOnline">ð± Online / UPI<\/label><\/div><\/div><\/div>  <\/div><div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel<\/button><button type="button" class="btn btn-success fw-bold" onclick="savePaymentEntry()">Save Received Entry â<\/button><\/div><\/div><\/div><\/div>  <div class="modal fade" id="genericInfoModal" tabindex="-1"><div class="modal-dialog modal-lg modal-dialog-centered"><div class="modal-content"><div class="modal-header"><h5 class="modal-title text-warning fw-bold" id="infoModalTitle">Details<\/h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"><\/button><\/div><div class="modal-body" id="infoModalBody"><\/div><div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close<\/button><\/div><\/div><\/div><\/div>  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"><\/script>  <script>    var societyMembers = JSON.parse(localStorage.getItem("gullak_members_v4")) || [      { id: "USR-00001", name: "Rahul Kumar", mobile: "9810011111", rd: 400, gullakLoan: 0, emergencyLoan: 0, bonus: 48, status: "ACTIVE", rdPaid: 4800, rdDues: 0, npaLoss: 0 },      { id: "USR-00002", name: "Suresh Sharma", mobile: "9810022222", rd: 400, gullakLoan: 30000, emergencyLoan: 10000, bonus: 48, status: "ACTIVE", rdPaid: 4400, rdDues: 400, npaLoss: 0 }    ];    var societyPayments = JSON.parse(localStorage.getItem("gullak_payments_v4")) || [      { txnId: "TXN-8801", date: "31-08-2026", name: "Rahul Kumar", mobile: "9810011111", id: "USR-00001", rd: 400, interest: 0, penalty: 0, total: 400, mode: "ONLINE", type: "PAYMENT_RECEIVED" }    ];    var societyLoans = JSON.parse(localStorage.getItem("gullak_loans_v4")) || [      { loanId: "LN-501", name: "Suresh Sharma", mobile: "9810022222", id: "USR-00002", type: "Gullak Loan", principal: 30000, rate: 1.0, outstanding: 25000, status: "ACTIVE" }    ];    function saveState() { localStorage.setItem("gullak_members_v4", JSON.stringify(societyMembers)); localStorage.setItem("gullak_payments_v4", JSON.stringify(societyPayments)); localStorage.setItem("gullak_loans_v4", JSON.stringify(societyLoans)); updateCards(); renderMembersTable(); renderPaymentsTable(); renderLoansTable(); }    function updateCards() {      document.getElementById("cardTotalMembers").innerText = societyMembers.length;      var totalRd = societyPayments.reduce(function(acc, p) { return acc + (Number(p.rd) || 0); }, 0) + 79200;      var totalLoan = societyMembers.reduce(function(acc, m) { return acc + (Number(m.gullakLoan) || 0) + (Number(m.emergencyLoan) || 0); }, 0);      document.getElementById("cardTotalRd").innerText = "₹" + totalRd.toLocaleString("en-IN");      document.getElementById("cardLoanDues").innerText = "₹" + totalLoan.toLocaleString("en-IN");      document.getElementById("cardFundAvailable").innerText = "₹" + (totalRd - totalLoan + 45000).toLocaleString("en-IN");    }    function renderMembersTable() {      var tbody = document.getElementById("membersTableBody"); tbody.innerHTML = "";      societyMembers.forEach(function(m) {        var totLoan = (Number(m.gullakLoan)||0) + (Number(m.emergencyLoan)||0);        var tr = document.createElement("tr");        tr.innerHTML = "<td><strong class='text-warning'>" + m.name + "<\/strong><br><small class='text-highlight-phone'>" + m.mobile + "<\/small><\/td><td>₹" + m.rd + "<\/td><td>₹" + m.gullakLoan + "<\/td><td>₹" + m.emergencyLoan + "<\/td><td><strong class='text-warning'>₹" + totLoan + "<\/strong><\/td><td><span class='badge badge-active'>" + m.status + "<\/span><\/td><td><button class='btn btn-sm btn-success fw-bold' onclick='openPaymentModal()'>Receive<\/button><\/td>";        tbody.appendChild(tr);      });    }    function renderPaymentsTable() {      var tbody = document.getElementById("paymentsTableBody"); tbody.innerHTML = "";      societyPayments.forEach(function(p) {        var tr = document.createElement("tr");        tr.innerHTML = "<td>" + p.txnId + "<\/td><td>" + p.date + "<\/td><td>" + p.name + "<\/td><td>₹" + p.rd + "<\/td><td>₹" + p.interest + "<\/td><td>₹" + p.penalty + "<\/td><td><span class='badge bg-secondary'>" + p.mode + "<\/span><\/td><td><strong class='text-success'>₹" + p.total + "<\/strong><\/td>";        tbody.appendChild(tr);      });    }    function renderLoansTable() {      var tbody = document.getElementById("loansTableBody"); tbody.innerHTML = "";      societyLoans.forEach(function(l) {        var tr = document.createElement("tr");        tr.innerHTML = "<td>" + l.loanId + "<\/td><td>" + l.name + "<\/td><td>" + l.type + "<\/td><td>₹" + l.principal + "<\/td><td>" + l.rate + "%<\/td><td><strong class='text-danger'>₹" + l.outstanding + "<\/strong><\/td>";        tbody.appendChild(tr);      });    }    function openPaymentModal() {      var pSel = document.getElementById("payMemberSelect"); pSel.innerHTML = "";      societyMembers.forEach(function(m){ var opt = document.createElement("option"); opt.value = m.id; opt.innerText = m.name + " (" + m.mobile + ")"; pSel.appendChild(opt); });      new bootstrap.Modal(document.getElementById("paymentModal")).show();    }    function savePaymentEntry() {      var mId = document.getElementById("payMemberSelect").value; var member = societyMembers.find(function(m){ return m.id === mId; });      var rd = Number(document.getElementById("payRdAmount").value) || 0; var intVal = Number(document.getElementById("payInterestAmount").value) || 0;      var mode = document.querySelector("input[name='singlePayMode']:checked").value;      societyPayments.unshift({ txnId: "TXN-" + Math.floor(1000 + Math.random()*9000), date: new Date().toLocaleDateString("en-GB"), name: member.name, mobile: member.mobile, id: member.id, rd: rd, interest: intVal, penalty: 0, total: (rd + intVal), mode: mode, type: "PAYMENT_RECEIVED" });      saveState(); bootstrap.Modal.getInstance(document.getElementById("paymentModal")).hide();      alert("â Payment recorded successfully!");    }    function openLoanDuesModal() { alert("Loan dues filter loaded!"); }    function openFundRangeModal() { alert("Fund dashboard loaded!"); }    function openNpaMembersModal() { alert("NPA Register loaded!"); }    saveState();  <\/script><\/body><\/html>
