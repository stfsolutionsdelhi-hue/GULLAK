name: Build Android Debug APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Setup Android Debug Keystore
        run: |
          mkdir -p ~/.android
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > ~/.android/debug.keystore
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Build Debug APK with Gradle
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename and Clean APK Filename
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Gullak-Society-v7.6.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gullak-Society-v7.6
          path: Gullak-Society-v7.6.apk
          retention-days: 14

      - name: Publish to GitHub Releases (latest)
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Gullak Society v7.6"
          body: "Automated Clean Build of Gullak Society v7.6 (Ready for installation by members)."
          files: Gullak-Society-v7.6.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
